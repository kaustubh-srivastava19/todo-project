<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auth</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
 <h2>Login</h2>

<input id="email" type="email" placeholder="Email" />
<input id="password" type="password" placeholder="Password" />

<button type="button" id="authButton" onclick="handleAuth()">
  Login
</button>

<p id="toggleText">
  Don't have an account?
  <button type="button" class="switch-btn" onclick="toggleAuth()">
    Sign up
  </button>
</p>
</div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
