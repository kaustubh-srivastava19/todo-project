<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do App</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2 class="logo">MyTodo</h2>

    <ul class="menu">
      <button class="sidebar-btn active" data-filter="all">📋 All Tasks</button>
      <button class="sidebar-btn" data-filter="completed">✅ Completed</button>
      <button class="sidebar-btn" data-filter="pending">⏳ Pending</button>
      <button class="sidebar-btn" data-filter="today">📆 Today</button>
    </ul>

    <button id="logout-btn" class="logout-btn">Logout</button>
  </aside>

  <!-- Main -->
  <main class="content">

  <div class="topbar">
    <h1 id="pageTitle">Inbox</h1>
    <div id="taskStats" class="task-stats"></div>

    <div class="topbar-actions">
      <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme">
        <span class="icon">☀️</span>
      </button>

      <div class="profile-container">
        <div id="profileBadge" class="profile-badge"></div>
        <div id="profileMenu" class="profile-menu hidden">
          <p id="profileName"></p>
          <p id="profileEmail"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="inbox-container">

    <div id="addTaskSection">

  <div class="add-task-row">
    <input
      type="text"
      id="todo-input"
      placeholder="✍️ Add a new task..."
    />

    <button id="add-btn">
      Add
    </button>
  </div>

  <div class="add-task-meta">
    <div class="date-picker-wrapper">
      <span class="meta-icon">📅</span>
      <input
        type="date"
        id="dueDate-input"
        title="Set due date"
      />
    </div>

    <div class="priority-selector">
      <span class="meta-icon">🚩</span>
      <select id="priority-input" title="Set priority">
        <option value="medium">🟡 Medium</option>
        <option value="high">🔴 High</option>
        <option value="low">🔵 Low</option>
      </select>
    </div>
  </div>

</div>

    <ul id="todo-list"></ul>

  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteConfirmModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <span class="warning-icon">⚠️</span>
        <h3 id="deleteModalTitle">Delete Task</h3>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete the task "<span id="deleteTaskName"></span>"?</p>
        <p id="deleteModalSubtext" class="modal-subtext">This action can be undone by administrators if needed.</p>
      </div>
      <div class="modal-footer">
        <button id="cancelDeleteBtn" class="btn-secondary">Cancel</button>
        <button id="confirmDeleteBtn" class="btn-danger">Yes, Delete</button>
      </div>
    </div>
  </div>

</main>
</div>

<script src="/js/todo.js"></script>

</body>
</html>
