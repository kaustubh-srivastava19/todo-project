<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do App</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2 class="logo">MyTodo</h2>

    <ul class="menu">
      <button class="sidebar-btn active" data-filter="all">
  All Tasks
</button>

<button class="sidebar-btn" data-filter="completed">
  Completed
</button>

<button class="sidebar-btn" data-filter="pending">
  Pending
</button>

<button class="sidebar-btn" data-filter="today">
  Today
</button>
    </ul>

    <button id="logout-btn" class="logout-btn">Logout</button>
  </aside>

  <!-- Main -->
  <main class="content">

  <div class="topbar">
    <h1 id="pageTitle">Inbox</h1>

    <div class="profile-container">

      <div id="profileBadge" class="profile-badge"></div>

      <div id="profileMenu" class="profile-menu hidden">
        <p id="profileName"></p>
        <p id="profileEmail"></p>
      </div>

    </div>
  </div>

  <div class="inbox-container">

    <div id="addTaskSection">

  <input
    type="text"
    id="todo-input"
    placeholder="✍️ Add a new task..."
  />

  <button id="add-btn">
    Add
  </button>

</div>

    <ul id="todo-list"></ul>

  </div>

</main>
</div>

<script src="/js/todo.js"></script>

</body>
</html>
