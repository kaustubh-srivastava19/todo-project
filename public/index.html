<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do App</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2 class="logo">MyTodo</h2>

    <ul class="menu">
      <li><button data-filter="all">All Tasks</button></li>
      <li><button data-filter="completed">Completed</button></li>
      <li><button data-filter="pending">Pending</button></li>
      <li><button data-filter="today">Today</button></li>
    </ul>

    <button id="logout-btn" class="logout-btn">Logout</button>
  </aside>

  <!-- Main -->
  <main class="content">
    <div class="inbox-container">

      <h1 id="pageTitle">Inbox</h1>

      <div id="addTaskSection">
        <input
          id="todo-input"
          type="text"
          placeholder="Enter task..."
        />

        <input
          type="date"
          id="dueDate"
        />

        <button id="add-btn">Add</button>
      </div>

      <ul id="todo-list"></ul>

    </div>
  </main>
</div>

<script src="/js/todo.js"></script>

</body>
</html>
