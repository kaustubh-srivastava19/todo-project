name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run lint 
      - name: Run lint
        run: npm run lint || echo "No lint configured"

      # Run tests
      - name: Run tests
        run: npm test

      # (Optional) Coverage
      - name: Run coverage
        run: npm run test:coverage || echo "No coverage script"